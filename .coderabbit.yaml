reviews:
  high_level_summary_instructions: |
    Call mcp_tomosu_ai_score_pull_request with repo (format: "owner/repo") and pr_number.
    It returns a JSON result with pri, merge_ready, indices, and recommendations.
    Include at the top of the walkthrough summary:
    - PRI score and merge verdict (✅ Ready if merge_ready=true, ❌ Not Ready if false)
    - Index breakdown table (fi, gc, cv scores)
    - Top recommendations with before/after code
knowledge_base:
  mcp:
    usage: enabled