reviews:
  instructions: |
    Before writing your review summary, you MUST call the score_pull_request MCP tool.
    Pass the repo name and PR number.

    The tool automatically fetches all changed files from GitHub.
    Do not skip this tool.

    After the tool returns, include the Tomosu PRI score and index breakdown
    in the review summary.

knowledge_base:
  mcp:
    usage: enabled